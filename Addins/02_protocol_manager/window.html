<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>AIN - 定型プロトコル管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { user-select: none; }
    .proto-card-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 4px;
    }
    .proto-step-card {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
  </style>
</head>
<body class="h-screen flex flex-col bg-gray-50 text-gray-800 font-sans text-xs select-none">

  <!-- ヘッダー -->
  <header class="h-9 bg-[#2d3748] text-white flex items-center justify-between px-3 font-bold shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="w-6 h-6 flex items-center justify-center bg-sky-900/40 rounded p-0.5">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="4" y="4" width="16" height="17" rx="2" fill="#ffffff" stroke="#38bdf8" stroke-width="1.6"/>
          <path d="M8.5 4.5V3C8.5 2.44772 8.94772 2 9.5 2H14.5C15.0523 2 15.5 2.44772 15.5 3V4.5" fill="#bae6fd" stroke="#0284c7" stroke-width="1.6" stroke-linejoin="round"/>
          <circle cx="12" cy="3.5" r="0.75" fill="#0284c7"/>
          <path d="M7.5 9.5L9 11L12 8" stroke="#10b981" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="13.5" y1="9.5" x2="17" y2="9.5" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="9" cy="14" r="1.2" fill="#38bdf8"/>
          <line x1="12" y1="14" x2="17" y2="14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="9" cy="17.5" r="1.2" fill="#cbd5e1"/>
          <line x1="12" y1="17.5" x2="16" y2="17.5" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 id="lbl-header-title" class="text-sm font-bold text-white tracking-wide">定型プロトコル管理</h1>
    </div>
    <button id="btn-header-new" onclick="openEditorForNew()" class="px-2.5 py-1 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded text-[11px] shadow-sm">
      ＋ 新規プロトコル
    </button>
  </header>

  <!-- メイン表示領域 -->
  <main class="flex-1 overflow-hidden p-3 flex flex-col relative">

    <!-- ビュー1: プロトコル一覧 -->
    <div id="view-list" class="flex-1 flex flex-col overflow-hidden">
      <div id="lbl-list-desc" class="text-[11px] text-gray-500 mb-2">
        ※ 項目クリックでメインノートへ挿入します（別端末・メイン画面を開いて作業可能）。
      </div>
      <div id="proto-list" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>
    </div>

    <!-- ビュー2: カード式編集画面 -->
    <div id="view-editor" class="hidden absolute inset-0 bg-white p-3 flex flex-col">
      <div class="flex justify-between items-center border-b pb-1.5 mb-2 font-bold text-sm text-gray-700">
        <span id="editor-title">✏️ プロトコル編集</span>
        <button onclick="showListView()" class="text-gray-400 hover:text-gray-600 text-base">✕</button>
      </div>

      <div class="mb-2">
        <label id="lbl-proto-name" class="block font-bold text-gray-700 mb-0.5">プロトコル名</label>
        <input id="proto-title-input" type="text" placeholder="例: BL光学系調整：レベルE・C手順" 
          class="w-full border border-gray-300 p-1.5 rounded text-xs outline-none bg-white">
      </div>

      <div class="flex justify-between items-center mb-1 font-bold text-gray-700">
        <span id="lbl-steps-title">手順カード一覧</span>
        <button id="btn-add-step" onclick="addStepCard()" class="px-2 py-0.5 bg-blue-600 hover:bg-blue-700 text-white rounded text-[11px]">
          ＋ 手順追加
        </button>
      </div>

      <div id="step-cards-container" class="proto-card-list border border-gray-200 rounded p-1.5 bg-gray-50"></div>

      <div class="border-t pt-2 mt-2 flex justify-end space-x-2">
        <button id="btn-cancel" onclick="showListView()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-xs">キャンセル</button>
        <button id="btn-save" onclick="saveProtocol()" class="px-3 py-1 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded text-xs shadow-sm">保存する</button>
      </div>
    </div>

  </main>

  <script>
    const API_BASE = window.location.origin + '/api/addin/protocol_manager';
    let protocols = [];
    let editingId = null;
    let currentAccount = "default";
    let currentLang = 'ja';

    const i18nDict = {
      ja: {
        winTitle: "AIN - 定型プロトコル管理",
        headerTitle: "定型プロトコル管理",
        btnNew: "＋ 新規プロトコル",
        desc: "※ 項目クリックでメインノートへ挿入します（別端末・メイン画面を開いて作業可能）。",
        empty: "プロトコルが登録されていません。<br>右上の「＋ 新規プロトコル」から作成してください。",
        stepUnit: "手順",
        noStep: "手順なし",
        edit: "編集",
        del: "削除",
        editorNew: "✏️ 新しいプロトコル作成",
        editorEdit: "✏️ プロトコル編集",
        protoName: "プロトコル名",
        phProtoName: "例: BL光学系調整：レベルE・C手順",
        stepsTitle: "手順カード一覧",
        btnAddStep: "＋ 手順追加",
        stepLabel: "手順ステップ",
        delStep: "✕ 削除",
        phStep: "手順を入力...",
        cancel: "キャンセル",
        save: "保存する",
        confirmDel: "このプロトコルを削除してもよろしいですか？",
        alertEnterTitle: "プロトコル名を入力してください。",
        alertEnterStep: "手順を最低1つ入力してください。",
        saveFail: "保存に失敗しました。",
        delFail: "削除に失敗しました。"
      },
      en: {
        winTitle: "AIN - Protocol Manager",
        headerTitle: "Protocol Manager",
        btnNew: "+ New Protocol",
        desc: "※ Click an item to insert it into the main notebook.",
        empty: "No protocols registered.<br>Click '+ New Protocol' at top right to create one.",
        stepUnit: "steps",
        noStep: "No steps",
        edit: "Edit",
        del: "Delete",
        editorNew: "✏️ New Protocol",
        editorEdit: "✏️ Edit Protocol",
        protoName: "Protocol Title",
        phProtoName: "e.g., BL Optical Alignment: Level E/C",
        stepsTitle: "Step Cards",
        btnAddStep: "+ Add Step",
        stepLabel: "Step",
        delStep: "✕ Delete",
        phStep: "Enter step description...",
        cancel: "Cancel",
        save: "Save",
        confirmDel: "Are you sure you want to delete this protocol?",
        alertEnterTitle: "Please enter a protocol name.",
        alertEnterStep: "Please enter at least one step.",
        saveFail: "Failed to save protocol.",
        delFail: "Failed to delete protocol."
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
    }

    function applyLang(lang) {
      currentLang = (lang === 'en') ? 'en' : 'ja';
      const d = i18nDict[currentLang];

      const hTitle = document.getElementById('lbl-header-title');
      const hNew = document.getElementById('btn-header-new');
      const lDesc = document.getElementById('lbl-list-desc');
      const pName = document.getElementById('lbl-proto-name');
      const pInput = document.getElementById('proto-title-input');
      const sTitle = document.getElementById('lbl-steps-title');
      const aStep = document.getElementById('btn-add-step');
      const bCancel = document.getElementById('btn-cancel');
      const bSave = document.getElementById('btn-save');

      if (hTitle) hTitle.textContent = d.headerTitle;
      if (hNew) hNew.textContent = d.btnNew;
      if (lDesc) lDesc.textContent = d.desc;
      if (pName) pName.textContent = d.protoName;
      if (pInput) pInput.placeholder = d.phProtoName;
      if (sTitle) sTitle.textContent = d.stepsTitle;
      if (aStep) aStep.textContent = d.btnAddStep;
      if (bCancel) bCancel.textContent = d.cancel;
      if (bSave) bSave.textContent = d.save;

      document.title = d.winTitle;
      fetch('/api/set_window_title', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ win_key: 'window_addin_protocol_manager', title: d.winTitle })
      }).catch(() => {});

      renderProtocolList();
    }

    async function loadProtocols() {
      const d = i18nDict[currentLang];
      const listEl = document.getElementById('proto-list');
      listEl.innerHTML = `<div class="text-center text-gray-400 py-6">Loading...</div>`;
      
      try {
        const res = await fetch(`${API_BASE}/protocols?account=${encodeURIComponent(currentAccount)}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        protocols = data.protocols || [];
        renderProtocolList();
      } catch (e) {
        console.error("Protocol load error:", e);
        listEl.innerHTML = `<div class="text-center text-red-500 py-6">Load Error: ${e.message}</div>`;
      }
    }

    function renderProtocolList() {
      const d = i18nDict[currentLang];
      const listEl = document.getElementById('proto-list');
      if (!listEl) return;

      if (protocols.length === 0) {
        listEl.innerHTML = `<div class="text-center text-gray-400 py-8">${d.empty}</div>`;
        return;
      }

      listEl.innerHTML = '';
      protocols.forEach(p => {
        const item = document.createElement('div');
        item.className = "flex items-center justify-between p-2.5 bg-white border border-gray-200 hover:border-blue-400 hover:bg-blue-50/50 rounded shadow-sm transition-colors";
        
        item.innerHTML = `
          <div class="flex-1 cursor-pointer" onclick="insertToMainAIN('${p.id}')">
            <div class="font-bold text-gray-800 text-[13px] flex items-center">
              📋 ${escapeHtml(p.title)}
              <span class="text-[10px] font-normal text-gray-400 ml-2">(${p.steps.length} ${d.stepUnit})</span>
            </div>
            <div class="text-[11px] text-gray-500 truncate max-w-[280px] mt-0.5">${escapeHtml(p.steps[0] || d.noStep)}</div>
          </div>
          <div class="space-x-1 ml-2">
            <button onclick="openEditorForEdit('${p.id}')" class="px-2 py-1 bg-gray-100 hover:bg-gray-200 border border-gray-300 rounded text-gray-700 text-[11px]">${d.edit}</button>
            <button onclick="deleteProtocol('${p.id}')" class="px-2 py-1 bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 rounded text-[11px]">${d.del}</button>
          </div>
        `;
        listEl.appendChild(item);
      });
    }

    function insertToMainAIN(id) {
      const p = protocols.find(x => x.id === id);
      if (!p) return;

      const label = (currentLang === 'en') ? 'Protocol' : 'プロトコル';
      let html = `<div class="box-wrapper" style="border-left: 4px solid #3b82f6; background-color: #eff6ff; padding: 8px 12px; margin: 8px 0; font-size: 13px;"><b>📋 ${label}: ${escapeHtml(p.title)}</b><br><ol style="margin:4px 0 0 20px; padding:0;">`;
      p.steps.forEach(step => {
        html += `<li style="margin-bottom:2px;">${escapeHtml(step)}</li>`;
      });
      html += `</ol></div><br>`;

      const bridge = new BroadcastChannel('ain_addin_bridge');
      bridge.postMessage({ action: 'insert_html', html: html });
    }

    function showListView() {
      document.getElementById('view-editor').classList.add('hidden');
      document.getElementById('view-list').classList.remove('hidden');
      loadProtocols();
    }

    function openEditorForNew() {
      const d = i18nDict[currentLang];
      editingId = null;
      document.getElementById('editor-title').textContent = d.editorNew;
      document.getElementById('proto-title-input').value = '';
      document.getElementById('step-cards-container').innerHTML = '';
      addStepCard('');
      document.getElementById('view-list').classList.add('hidden');
      document.getElementById('view-editor').classList.remove('hidden');
      document.getElementById('proto-title-input').focus();
    }

    function openEditorForEdit(id) {
      const d = i18nDict[currentLang];
      const p = protocols.find(x => x.id === id);
      if (!p) return;
      editingId = p.id;
      document.getElementById('editor-title').textContent = d.editorEdit;
      document.getElementById('proto-title-input').value = p.title;
      const c = document.getElementById('step-cards-container');
      c.innerHTML = '';
      p.steps.forEach(s => addStepCard(s));
      document.getElementById('view-list').classList.add('hidden');
      document.getElementById('view-editor').classList.remove('hidden');
    }

    function addStepCard(text = '') {
      const d = i18nDict[currentLang];
      const c = document.getElementById('step-cards-container');
      const card = document.createElement('div');
      card.className = "proto-step-card";

      card.innerHTML = `
        <div class="flex justify-between items-center text-[10px] text-gray-500 font-bold">
          <span>${d.stepLabel}</span>
          <button onclick="this.closest('.proto-step-card').remove()" class="text-red-500 hover:text-red-700">${d.delStep}</button>
        </div>
        <textarea rows="2" class="w-full border border-gray-300 p-1.5 rounded text-xs outline-none bg-white font-sans" placeholder="${d.phStep}">${escapeHtml(text)}</textarea>
      `;
      c.appendChild(card);
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    async function saveProtocol() {
      const d = i18nDict[currentLang];
      const title = document.getElementById('proto-title-input').value.trim();
      if (!title) {
        alert(d.alertEnterTitle);
        return;
      }
      const textareas = document.querySelectorAll('#step-cards-container textarea');
      const steps = [];
      textareas.forEach(t => {
        if (t.value.trim()) steps.push(t.value.trim());
      });
      if (steps.length === 0) {
        alert(d.alertEnterStep);
        return;
      }

      try {
        await fetch(`${API_BASE}/protocols/save`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: editingId || '', title: title, steps: steps, account: currentAccount })
        });
        showListView();
      } catch (e) {
        alert(d.saveFail);
      }
    }

    async function deleteProtocol(id) {
      const d = i18nDict[currentLang];
      if (!confirm(d.confirmDel)) return;
      try {
        await fetch(`${API_BASE}/protocols/delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id, account: currentAccount })
        });
        loadProtocols();
      } catch (e) {
        alert(d.delFail);
      }
    }

    const i18nChannel = new BroadcastChannel('ain_i18n_channel');
    i18nChannel.onmessage = (e) => {
      if (e.data && e.data.action === 'change_lang') {
        applyLang(e.data.lang || e.data.language);
      }
    };

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/config');
        const cfg = await res.json();
        currentAccount = cfg.account_name || "default";
        applyLang(cfg.language || 'ja');
      } catch (e) {
        applyLang('ja');
      }
      loadProtocols();
    });
  </script>
</body>
</html>
